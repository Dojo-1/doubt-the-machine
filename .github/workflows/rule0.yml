name: Rule 0 contract

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  self-audit-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'

      - name: Check Rule 0 contract
        run: python scripts/check_rule0.py

      - name: Check ACAF generator integrity
        run: python scripts/check_acaf_generators.py --seeds 3

      - name: Fuzz Rule 0 contract
        run: python scripts/acaf_ambigator.py --seeds 3 --max-escape-rate 0.0 --max-false-alarm-rate 0.0 --quiet

      - name: Attack operational meaning direction
        run: python scripts/acaf_meaning_matrix.py --max-inversion-escape-rate 0.0 --max-paraphrase-false-alarm-rate 0.0

      - name: Install API test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Test GenGatewAI API
        run: pytest

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Test vGPU visualization contract
        run: |
          cd web
          npm ci
          npm test
          npm run typecheck
